<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Techlifai | Digital Studio</title>
    <meta
      name="description"
      content="Techlifai is an Islamabad based studio designing and engineering websites, apps, SEO and AI automation."
    />
    <link rel="canonical" href="https://techlifai.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Techlifai" />
    <meta property="og:title" content="Techlifai | Digital Studio" />
    <meta
      property="og:description"
      content="Websites, apps, SEO and AI automation from Islamabad, Pakistan."
    />
    <meta property="og:url" content="https://techlifai.com/" />
    <meta name="twitter:card" content="summary" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Techlifai",
        "url": "https://techlifai.com",
        "email": "techlifai@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Islamabad",
          "addressCountry": "PK"
        }
      }
    </script>
    <meta name="theme-color" content="#0b0b0c" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (!t)
            t = matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
